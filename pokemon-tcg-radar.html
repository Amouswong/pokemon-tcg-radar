        // Calculate optimal route and open in Google Maps
        // Calculate optimal route and open in Google Maps
        function calculateAndShowRoute(storesInRadius, startPos, originalCenter) {
            // Exclude the chosen start store from the waypoint list so it stays the
            // ORIGIN only (otherwise TSP picks it as the nearest point at distance 0
            // and it becomes waypoint #1, shifting the real start in Google Maps).
            const routeStores = storesInRadius.filter(s => {
                const d = startPos.distanceTo(s.latlng);
                return d > 5; // >5m apart => not the start store itself
            });

            // Calculate optimal route using Nearest Neighbor TSP starting from selected store
            const orderedStores = [];
            const visited = new Set();
            let currentPos = startPos;

            while (orderedStores.length < routeStores.length) {
                let nearestIdx = -1;
                let minDist = Infinity;

                for (let i = 0; i < routeStores.length; i++) {
                    if (visited.has(i)) continue;

                    const dist = currentPos.distanceTo(routeStores[i].latlng);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestIdx = i;
                    }
                }

                if (nearestIdx !== -1) {
                    visited.add(nearestIdx);
                    orderedStores.push(routeStores[nearestIdx]);
                    currentPos = routeStores[nearestIdx].latlng;
                }
            }

            // Calculate total distance
            let totalDist = 0;
            const routeCoords = [startPos, ...orderedStores.map(s => s.latlng), startPos];
            for (let i = 0; i < routeCoords.length - 1; i++) {
                totalDist += routeCoords[i].distanceTo(routeCoords[i + 1]);
            }

            // Coord precision trimmed to 6 decimals (~0.1m) for Google Maps stability.
            const coord = (lat, lng) => `${(+lat).toFixed(6)},${(+lng).toFixed(6)}`;

            // origin = chosen start store; destination = LAST store on the TSP path
            // (origin==destination makes routes flaky). Middle stores = waypoints (max 9).
            const startCoord = coord(startPos.lat, startPos.lng);
            let origin = startCoord;
            let destination = startCoord;
            let routeForGoogleMaps = [];

            if (orderedStores.length > 0) {
                const last = orderedStores[orderedStores.length - 1];
                destination = coord(last.latlng.lat, last.latlng.lng);
                const middle = orderedStores.slice(0, -1);
                routeForGoogleMaps = middle.length > 9 ? middle.slice(0, 9) : middle;
            }

            let waypoints = '';
            if (routeForGoogleMaps.length > 0) {
                const waypointCoords = routeForGoogleMaps.map(store =>
                    coord(store.latlng.lat, store.latlng.lng)
                );
                waypoints = `&waypoints=${waypointCoords.join('|')}`;
            }

            const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints}&travelmode=driving`;
            console.log('🗺️ [Radius] Nav URL:', googleMapsUrl);

            // Show confirmation with route details
            const totalStops = 1 + orderedStores.length; // start store + visited stores
            const storeList = orderedStores.slice(0, 5).map((store, idx) =>
                `${idx + 1}. ${store.brand} - ${store.name || ''}`
            ).join('\n');

            const walkTime = Math.ceil(totalDist / 80); // 80m/min walking speed
            let message = `已經整好最佳路線！\n\n`;
            message += `到訪店舖數: ${totalStops} 間\n`;
            message += `總距離: ${(totalDist / 1000).toFixed(1)} km\n`;
            message += `預計需時: 約 ${walkTime} 分鐘（步行）\n\n`;
            message += `頭 5 間店舖:\n${storeList}`;

            if (totalStops > 10) {
                message += `\n\n※ Google Maps 最多支援 9 個途經點\n只會顯示頭幾間店舖嘅路線`;
            }
            message += `\n\n用 Google Maps 開啟？`;

            showCustomConfirm('確認路線', message,
                () => {
                    const newWindow = window.open(googleMapsUrl, '_blank');
                    if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                        const linkHtml = `<a href="${googleMapsUrl}" target="_blank" style="color: #2196F3; text-decoration: underline;">㩒呢度用 Google Maps 開啟</a>`;
                        showCustomAlert('彈出視窗被封鎖', `瀏覽器封鎖咗彈出視窗。\n\n${linkHtml}\n\n或者喺瀏覽器設定允許彈出視窗。`);
                    }
                },
                null
            );
        }

        // ==================== Coverage Route ("pass by as many stores as possible") ====================
        // Perpendicular distance (meters, flat-earth approx) from point p to segment a-b.
        function _distPointToSegmentMeters(p, a, b) {
            const LAT_M = 111000, LNG_M = 111000 * Math.cos(p.lat * Math.PI / 180);
            const px = (p.lng - a.lng) * LNG_M, py = (p.lat - a.lat) * LAT_M;
            const bx = (b.lng - a.lng) * LNG_M, by = (b.lat - a.lat) * LAT_M;
            const segLenSq = bx * bx + by * by;
            let t = segLenSq > 0 ? (px * bx + py * by) / segLenSq : 0;
            t = Math.max(0, Math.min(1, t));
            const cx = bx * t, cy = by * t;
            return Math.hypot(px - cx, py - cy);
        }

        // Douglas-Peucker simplification over a path of {latlng} points (start/end
        // always kept). Returns the subset of points that best preserves the path's
        // shape. Used to thin a full nearest-neighbour TSP path down to <=9 pins
        // for Google Maps, while stores that were dropped stay close (<=30m) to
        // the resulting straight-line path and count as "passed by".
        function _douglasPeucker(points, epsilonMeters) {
            if (points.length <= 2) return points;

            let maxDist = 0;
            let maxIdx = 0;
            const first = points[0], last = points[points.length - 1];
            for (let i = 1; i < points.length - 1; i++) {
                const d = _distPointToSegmentMeters(points[i].latlng, first.latlng, last.latlng);
                if (d > maxDist) {
                    maxDist = d;
                    maxIdx = i;
                }
            }

            if (maxDist <= epsilonMeters) {
                return [first, last];
            }

            const left = _douglasPeucker(points.slice(0, maxIdx + 1), epsilonMeters);
            const right = _douglasPeucker(points.slice(maxIdx), epsilonMeters);
            return left.slice(0, -1).concat(right);
        }

        const PASS_BY_METERS = 30; // "in eyesight" distance for a store to count as passed

        function calculateAndShowCoverageRoute(storesInRadius, startPos, originalCenter) {
            const routeStores = storesInRadius.filter(s => startPos.distanceTo(s.latlng) > 5);

            // Step 1: full Nearest-Neighbour TSP path through EVERY matching store
            // (not capped at 10) — this is the shape we want the route to follow.
            const orderedStores = [];
            const visited = new Set();
            let currentPos = startPos;
            while (orderedStores.length < routeStores.length) {
                let nearestIdx = -1, minDist = Infinity;
                for (let i = 0; i < routeStores.length; i++) {
                    if (visited.has(i)) continue;
                    const dist = currentPos.distanceTo(routeStores[i].latlng);
                    if (dist < minDist) { minDist = dist; nearestIdx = i; }
                }
                if (nearestIdx !== -1) {
                    visited.add(nearestIdx);
                    orderedStores.push(routeStores[nearestIdx]);
                    currentPos = routeStores[nearestIdx].latlng;
                }
            }

            const fullPath = [{ latlng: startPos }, ...orderedStores];

            // Step 2: thin the path down to <=9 intermediate pins (Google Maps
            // waypoint limit) via Douglas-Peucker, increasing epsilon until it fits.
            let epsilon = PASS_BY_METERS;
            let simplified = _douglasPeucker(fullPath, epsilon);
            while (simplified.length - 2 > 9 && epsilon < 5000) {
                epsilon *= 1.5;
                simplified = _douglasPeucker(fullPath, epsilon);
            }

            // Pin stores = simplified path minus the start point itself.
            const pinStores = simplified.slice(1).filter(s => s !== fullPath[0]);
            const pinIds = new Set(pinStores.map(s => s.id));

            // Step 3: count "passed by" — every store within PASS_BY_METERS of the
            // final straight-line pin-to-pin path (includes the pins themselves).
            const pathPoints = [startPos, ...pinStores.map(s => s.latlng)];
            let passedByCount = 0;
            routeStores.forEach(store => {
                if (pinIds.has(store.id)) { passedByCount++; return; }
                for (let i = 0; i < pathPoints.length - 1; i++) {
                    if (_distPointToSegmentMeters(store.latlng, pathPoints[i], pathPoints[i + 1]) <= PASS_BY_METERS) {
                        passedByCount++;
                        return;
                    }
                }
            });

            // Total distance along the final (pin-only) path.
            let totalDist = 0;
            for (let i = 0; i < pathPoints.length - 1; i++) {
                totalDist += pathPoints[i].distanceTo(pathPoints[i + 1]);
            }

            const coord = (lat, lng) => `${(+lat).toFixed(6)},${(+lng).toFixed(6)}`;
            const startCoord = coord(startPos.lat, startPos.lng);
            let origin = startCoord;
            let destination = startCoord;
            let waypointStores = [];

            if (pinStores.length > 0) {
                const last = pinStores[pinStores.length - 1];
                destination = coord(last.latlng.lat, last.latlng.lng);
                waypointStores = pinStores.slice(0, -1);
            }

            let waypoints = '';
            if (waypointStores.length > 0) {
                waypoints = `&waypoints=${waypointStores.map(s => coord(s.latlng.lat, s.latlng.lng)).join('|')}`;
            }

            const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints}&travelmode=driving`;
            console.log('🗺️ [Coverage] Nav URL:', googleMapsUrl);

            const walkTime = Math.ceil(totalDist / 80); // 80m/min walking
            const driveTime = Math.max(1, Math.ceil(totalDist / 500)); // ~30km/h city driving = 500m/min

            let message = `已經整好路線！\n\n`;
            message += `方式: 路過最多店（最短路線）\n`;
            message += `實際停靠 (pin): ${pinStores.length} 間\n`;
            message += `路過範圍內: ${passedByCount} / ${routeStores.length} 間`;
            if (routeStores.length > 0) {
                message += ` (${Math.round(passedByCount / routeStores.length * 100)}%)`;
            }
            message += `\n總距離: ${(totalDist / 1000).toFixed(1)} km\n`;
            message += `預計需時:\n`;
            message += `  🚗 開車約 ${driveTime} 分鐘\n`;
            message += `  🚶 步行約 ${walkTime} 分鐘\n\n`;
            message += `※ 路過店數係以直線距離估算,實際路面路線可能有落差。\n\n`;
            message += `用 Google Maps 開啟？`;

            showCustomConfirm('確認路線', message,
                () => {
                    const newWindow = window.open(googleMapsUrl, '_blank');
                    if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                        const linkHtml = `<a href="${googleMapsUrl}" target="_blank" style="color: #2196F3; text-decoration: underline;">㩒呢度用 Google Maps 開啟</a>`;
                        showCustomAlert('彈出視窗被封鎖', `瀏覽器封鎖咗彈出視窗。\n\n${linkHtml}\n\n或者喺瀏覽器設定允許彈出視窗。`);
                    }
                },
                null
            );
        }

        // Calculate and show route for route planning mode navigation
        function calculateAndShowRouteForNav(startStore, storesInRoute, startPoint, endPoint) {
            console.log('calculateAndShowRouteForNav called');
            console.log('Start store:', startStore && startStore.brand, startStore && startStore.name, startStore && startStore.latitude, startStore && startStore.longitude);
            console.log('Total stores in route:', storesInRoute.length);

            // Helper: always derive a LatLng from lat/lng fields (some store objects
            // don't carry a .latlng property, which used to crash distanceTo()).
            const asLatLng = (s) => L.latLng(s.latitude, s.longitude);

            // Remove start store from list if present
            const otherStores = storesInRoute.filter(s => s.id !== startStore.id);

            // Use Nearest Neighbor TSP starting from selected store
            const orderedStores = [];
            const visited = new Set();
            let currentPos = asLatLng(startStore);

            while (orderedStores.length < otherStores.length) {
                let nearestIdx = -1;
                let minDist = Infinity;

                for (let i = 0; i < otherStores.length; i++) {
                    if (visited.has(i)) continue;

                    const dist = currentPos.distanceTo(asLatLng(otherStores[i]));
                    if (dist < minDist) {
                        minDist = dist;
                        nearestIdx = i;
                    }
                }

                if (nearestIdx !== -1) {
                    visited.add(nearestIdx);
                    orderedStores.push(otherStores[nearestIdx]);
                    currentPos = asLatLng(otherStores[nearestIdx]);
                }
            }

            // Calculate total distance (origin = start store, then TSP order, then end point)
            let totalDist = 0;
            const routeCoords = [asLatLng(startStore), ...orderedStores.map(asLatLng), endPoint];
            for (let i = 0; i < routeCoords.length - 1; i++) {
                totalDist += routeCoords[i].distanceTo(routeCoords[i + 1]);
            }

            // Coord precision trimmed to 6 decimals (~0.1m) for Google Maps stability.
            const coord = (lat, lng) => `${(+lat).toFixed(6)},${(+lng).toFixed(6)}`;

            // The chosen start store IS the navigation origin (matches the UI text
            // "スタート店舗"). The remaining stores are the waypoints in TSP order.
            // Google Maps allows up to ~9 intermediate waypoints (origin+dest excluded).
            const waypointStores = orderedStores.length > 9 ? orderedStores.slice(0, 9) : orderedStores;

            // Build Google Maps URL
            const origin = coord(startStore.latitude, startStore.longitude);
            const destination = coord(endPoint.lat, endPoint.lng);

            let waypoints = '';
            if (waypointStores.length > 0) {
                const waypointCoords = waypointStores.map(store =>
                    coord(store.latitude, store.longitude)
                );
                waypoints = `&waypoints=${waypointCoords.join('|')}`;
            }

            const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints}&travelmode=driving`;
            console.log('🗺️ Nav URL (origin should be the chosen start store):', googleMapsUrl);
            console.log('   origin =', origin, '| waypoints =', waypointStores.length, '| dest =', destination);

            const totalStops = 1 + orderedStores.length; // start store + others
            let message = `起點店舖: ${BRAND_ICONS[startStore.brand]} ${startStore.brand} ${startStore.name}\n\n`;
            message += `到訪店舖數: ${totalStops} 間\n`;
            message += `總距離: ${(totalDist / 1000).toFixed(2)} km`;

            if (totalStops > 10) {
                message += `\n\n※ Google Maps 最多支援 10 個途經點\n只會顯示頭 10 間店舖嘅路線`;
            }
            message += `\n\n用 Google Maps 開啟？`;

            showCustomConfirm('確認路線', message,
                () => {
                    const newWindow = window.open(googleMapsUrl, '_blank');
                    if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                        const linkHtml = `<a href="${googleMapsUrl}" target="_blank" style="color: #2196F3; text-decoration: underline;">㩒呢度用 Google Maps 開啟</a>`;
                        showCustomAlert('彈出視窗被封鎖', `瀏覽器封鎖咗彈出視窗。\n\n${linkHtml}\n\n或者喺瀏覽器設定允許彈出視窗。`);
                    }
                },
                null
            );
        }

        // Calculate and show route for area mode
        function calculateAndShowRouteForArea(startStore, storesInCluster, clusterCenter, clusterIdx) {
            console.log('calculateAndShowRouteForArea called');
            console.log('Start store:', startStore.brand, startStore.name);
            console.log('Total stores in cluster:', storesInCluster.length);

            // Remove start store from list if present
            const otherStores = storesInCluster.filter(s => s.id !== startStore.id);

            // Use Nearest Neighbor TSP starting from selected store
            const orderedStores = [];
            const visited = new Set();
            let currentPos = L.latLng(startStore.latitude, startStore.longitude);

            while (orderedStores.length < otherStores.length) {
                let nearestIdx = -1;
                let minDist = Infinity;

                for (let i = 0; i < otherStores.length; i++) {
                    if (visited.has(i)) continue;

                    const dist = currentPos.distanceTo(L.latLng(otherStores[i].latitude, otherStores[i].longitude));
                    if (dist < minDist) {
                        minDist = dist;
                        nearestIdx = i;
                    }
                }

                if (nearestIdx !== -1) {
                    visited.add(nearestIdx);
                    orderedStores.push(otherStores[nearestIdx]);
                    currentPos = L.latLng(otherStores[nearestIdx].latitude, otherStores[nearestIdx].longitude);
                }
            }

            // Calculate total distance (round trip starting and ending at start store)
            let totalDist = 0;
            const startStoreLatLng = L.latLng(startStore.latitude, startStore.longitude);
            let prevPos = startStoreLatLng;

            orderedStores.forEach(store => {
                const storePos = L.latLng(store.latitude, store.longitude);
                totalDist += prevPos.distanceTo(storePos);
                prevPos = storePos;
            });

            totalDist += prevPos.distanceTo(startStoreLatLng); // Last store back to start store

            // Google Maps free URL allows up to 9 intermediate waypoints (origin+dest
            // excluded). Coord precision is trimmed to 6 decimals (~0.1m): higher
            // precision sometimes makes Google Maps snap to the wrong road / act flaky.
            const coord = (lat, lng) => `${(+lat).toFixed(6)},${(+lng).toFixed(6)}`;

            // origin = chosen start store. destination = LAST store on the TSP path
            // (NOT the start store again — origin==destination makes the route flaky).
            // The remaining stores in between become the waypoints.
            const startCoord = coord(startStore.latitude, startStore.longitude);
            let origin = startCoord;
            let destination = startCoord;
            let waypointStores = [];

            if (orderedStores.length === 0) {
                // only the start store — no route, just center on it
                destination = startCoord;
            } else {
                destination = coord(orderedStores[orderedStores.length - 1].latitude,
                                    orderedStores[orderedStores.length - 1].longitude);
                const middle = orderedStores.slice(0, -1); // everything except the last
                waypointStores = middle.length > 9 ? middle.slice(0, 9) : middle;
            }

            let waypoints = '';
            if (waypointStores.length > 0) {
                const waypointCoords = waypointStores.map(s => coord(s.latitude, s.longitude));
                waypoints = `&waypoints=${waypointCoords.join('|')}`;
            }

            const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints}&travelmode=driving`;
            console.log('🗺️ [Area] Nav URL — origin should be chosen start store:', googleMapsUrl);
            console.log('   origin =', origin, '| waypoints =', waypointStores.length, '| dest =', destination);

            const isHighest = clusterIdx === window.maxClusterIdx;
            const totalStops = 1 + orderedStores.length;
            let message = `${isHighest ? '⭐ ' : ''}起點店舖: ${BRAND_ICONS[startStore.brand]} ${startStore.brand} ${startStore.name}\n\n`;
            message += `到訪店舖數: ${totalStops} 間\n`;
            message += `總距離: ${(totalDist / 1000).toFixed(2)} km`;

            if (totalStops > 10) {
                message += `\n\n※ Google Maps 最多支援 10 個途經點\n只會顯示頭 10 間店舖嘅路線`;
            }
            message += `\n\n用 Google Maps 開啟？`;

            showCustomConfirm('確認路線', message,
                () => {
                    const newWindow = window.open(googleMapsUrl, '_blank');
                    if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {

                    }

        // Coverage-mode route for the area/cluster flow: same TSP + Douglas-Peucker
        // simplification as calculateAndShowCoverageRoute, but the loop returns to the
        // chosen start store at the end (round trip), matching calculateAndShowRouteForArea.
        function calculateAndShowCoverageRouteForArea(startStore, storesInCluster, clusterIdx) {
            const startPos = L.latLng(startStore.latitude, startStore.longitude);
            const routeStores = storesInCluster
                .filter(s => s.id !== startStore.id)
                .map(s => ({ ...s, latlng: L.latLng(s.latitude, s.longitude) }))
                .filter(s => startPos.distanceTo(s.latlng) > 5);

            // Step 1: full Nearest-Neighbour TSP through EVERY matching store.
            const orderedStores = [];
            const visited = new Set();
            let currentPos = startPos;
            while (orderedStores.length < routeStores.length) {
                let nearestIdx = -1, minDist = Infinity;
                for (let i = 0; i < routeStores.length; i++) {
                    if (visited.has(i)) continue;
                    const dist = currentPos.distanceTo(routeStores[i].latlng);
                    if (dist < minDist) { minDist = dist; nearestIdx = i; }
                }
                if (nearestIdx !== -1) {
                    visited.add(nearestIdx);
                    orderedStores.push(routeStores[nearestIdx]);
                    currentPos = routeStores[nearestIdx].latlng;
                }
            }

            const fullPath = [{ latlng: startPos }, ...orderedStores];

            // Step 2: thin down to <=9 intermediate pins via Douglas-Peucker.
            let epsilon = PASS_BY_METERS;
            let simplified = _douglasPeucker(fullPath, epsilon);
            while (simplified.length - 2 > 9 && epsilon < 5000) {
                epsilon *= 1.5;
                simplified = _douglasPeucker(fullPath, epsilon);
            }

            const pinStores = simplified.slice(1).filter(s => s !== fullPath[0]);
            const pinIds = new Set(pinStores.map(s => s.id));

            // Step 3: count "passed by" against the final pin-to-pin path, INCLUDING
            // the return leg back to the start store (round trip).
            const pathPoints = [startPos, ...pinStores.map(s => s.latlng), startPos];
            let passedByCount = 0;
            routeStores.forEach(store => {
                if (pinIds.has(store.id)) { passedByCount++; return; }
                for (let i = 0; i < pathPoints.length - 1; i++) {
                    if (_distPointToSegmentMeters(store.latlng, pathPoints[i], pathPoints[i + 1]) <= PASS_BY_METERS) {
                        passedByCount++;
                        return;
                    }
                }
            });

            let totalDist = 0;
            for (let i = 0; i < pathPoints.length - 1; i++) {
                totalDist += pathPoints[i].distanceTo(pathPoints[i + 1]);
            }

            const coord = (lat, lng) => `${(+lat).toFixed(6)},${(+lng).toFixed(6)}`;
            const startCoord = coord(startStore.latitude, startStore.longitude);
            let origin = startCoord;
            let destination = startCoord;
            let waypointStores = [];

            if (pinStores.length > 0) {
                const last = pinStores[pinStores.length - 1];
                destination = coord(last.latlng.lat, last.latlng.lng);
                waypointStores = pinStores.slice(0, -1);
            }

            let waypoints = '';
            if (waypointStores.length > 0) {
                waypoints = `&waypoints=${waypointStores.map(s => coord(s.latlng.lat, s.latlng.lng)).join('|')}`;
            }

            const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints}&travelmode=driving`;
            console.log('🗺️ [Area Coverage] Nav URL:', googleMapsUrl);

            const walkTime = Math.ceil(totalDist / 80);
            const driveTime = Math.max(1, Math.ceil(totalDist / 500));

            const isHighest = clusterIdx === window.maxClusterIdx;
            let message = `${isHighest ? '⭐ ' : ''}起點店舖: ${BRAND_ICONS[startStore.brand]} ${startStore.brand} ${startStore.name}\n\n`;
            message += `方式: 路過最多店（最短路線）\n`;
            message += `實際停靠 (pin): ${pinStores.length + 1} 間\n`;
            message += `路過範圍內: ${passedByCount + 1} / ${routeStores.length + 1} 間`;
            message += ` (${Math.round((passedByCount + 1) / (routeStores.length + 1) * 100)}%)`;
            message += `\n總距離: ${(totalDist / 1000).toFixed(1)} km\n`;
            message += `預計需時:\n`;
            message += `  🚗 開車約 ${driveTime} 分鐘\n`;
            message += `  🚶 步行約 ${walkTime} 分鐘\n\n`;
            message += `※ 路過店數係以直線距離估算,實際路面路線可能有落差。\n\n`;
            message += `用 Google Maps 開啟？`;

            showCustomConfirm('確認路線', message,
                () => {
                    const newWindow = window.open(googleMapsUrl, '_blank');
                    if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                        const linkHtml = `<a href="${googleMapsUrl}" target="_blank" style="color: #2196F3; text-decoration: underline;">㩒呢度用 Google Maps 開啟</a>`;
                        showCustomAlert('彈出視窗被封鎖', `瀏覽器封鎖咗彈出視窗。\n\n${linkHtml}\n\n或者喺瀏覽器設定允許彈出視窗。`);
                    }
                },
                null
            );
        }

        // Shared, FAST route-buffer tester. Precomputes route sample points + a
        // bounding box ONCE, then tests each store with a bbox reject + flat-earth
        // distance (no per-store Leaflet.distanceTo trig). ~10x faster over 15k stores.
        // Returns a function (lat,lng) -> boolean.
        function makeRouteBufferTester(pts, bufferRadius) {
            const LAT_M = 111000;
            const LNG_M = 111000 * Math.cos(pts[0].lat * Math.PI / 180);
            const samples = [];
            for (let i = 0; i < pts.length - 1; i++) {
                const p1 = pts[i], p2 = pts[i + 1];
                const segM = p1.distanceTo(p2);
                const steps = Math.max(1, Math.ceil(segM / 500));
                for (let j = 0; j <= steps; j++) {
                    const f = j / steps;
                    samples.push([p1.lat + (p2.lat - p1.lat) * f,
                                  p1.lng + (p2.lng - p1.lng) * f]);
                }
            }
            let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
            for (const [la, ln] of samples) {
                if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
                if (ln < minLng) minLng = ln; if (ln > maxLng) maxLng = ln;
            }
            const padLat = bufferRadius / LAT_M, padLng = bufferRadius / LNG_M;
            minLat -= padLat; maxLat += padLat; minLng -= padLng; maxLng += padLng;
            const bufSq = bufferRadius * bufferRadius;
            return function (lat, lng) {
                if (lat < minLat || lat > maxLat || lng < minLng || lng > maxLng) return false;
                for (let k = 0; k < samples.length; k++) {
                    const dLat = (lat - samples[k][0]) * LAT_M;
                    const dLng = (lng - samples[k][1]) * LNG_M;
                    if (dLat * dLat + dLng * dLng <= bufSq) return true;
                }
                return false;
            };
        }

        // Helper function for custom confirm dialog
        window.openRadiusRouteInGoogleMaps = openRadiusRouteInGoogleMaps;

        // Open route in Google Maps for route planning mode
        function openRouteInGoogleMaps() {
            if (routePoints.length < 2) {
                showCustomAlert('錯誤', '未設定路線。');
                return;
            }

            const filters = getFilters();
            const allStoresInRoute = [];

            // --- Performance: precompute route sample points ONCE (not per store),
            //     and use a flat-earth distance approximation instead of Leaflet's
            //     trig-heavy distanceTo(). At Japan's latitude this is accurate enough
            //     for a buffer test and is ~10x faster over 15k+ stores. ---
            const bufferRadius = currentRadiusMeters;
            const LAT_M = 111000;                    // metres per degree latitude
            const midLat = routePoints[0].lat * Math.PI / 180;
            const LNG_M = 111000 * Math.cos(midLat); // metres per degree longitude

            // Sampled points along the whole route (every ~500m)
            const samples = [];
            for (let i = 0; i < routePoints.length - 1; i++) {
                const p1 = routePoints[i], p2 = routePoints[i + 1];
                const segM = p1.distanceTo(p2);
                const steps = Math.max(1, Math.ceil(segM / 500));
                for (let j = 0; j <= steps; j++) {
                    const f = j / steps;
                    samples.push([p1.lat + (p2.lat - p1.lat) * f,
                                  p1.lng + (p2.lng - p1.lng) * f]);
                }
            }
            // Bounding box of the route + buffer, for a cheap first-pass reject
            let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
            for (const [la, ln] of samples) {
                if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
                if (ln < minLng) minLng = ln; if (ln > maxLng) maxLng = ln;
            }
            const padLat = bufferRadius / LAT_M, padLng = bufferRadius / LNG_M;
            minLat -= padLat; maxLat += padLat; minLng -= padLng; maxLng += padLng;
            const bufSq = bufferRadius * bufferRadius;

            function isInRouteBuffer(lat, lng) {
                // cheap bbox reject first
                if (lat < minLat || lat > maxLat || lng < minLng || lng > maxLng) return false;
                for (let k = 0; k < samples.length; k++) {
                    const dLat = (lat - samples[k][0]) * LAT_M;
                    const dLng = (lng - samples[k][1]) * LNG_M;
                    if (dLat * dLat + dLng * dLng <= bufSq) return true;
                }
                return false;
            }

            // Nearest distance (metres) from a point to the route, for ranking top-up
            // stores by how conveniently they sit along the path.
            function distToRoute(lat, lng) {
                let best = Infinity;
                for (let k = 0; k < samples.length; k++) {
                    const dLat = (lat - samples[k][0]) * LAT_M;
                    const dLng = (lng - samples[k][1]) * LNG_M;
                    const d = dLat * dLat + dLng * dLng;
                    if (d < best) best = d;
                }
                return Math.sqrt(best);
            }

            // Collect all stores within route buffer (without brand filter yet)
            if (filters.showStores) {
                allStores.forEach(store => {

                    if (isInRouteBuffer(store.latitude, store.longitude)) {
                        allStoresInRoute.push({
                            ...store,
                            latlng: L.latLng(store.latitude, store.longitude)
                        });
                    }
                });
            }

            if (allStoresInRoute.length === 0) {
                showCustomAlert('冇結果', '路線範圍內搵唔到店舖。');
                return;
            }

            // Count stores by brand
            const brandCounts = {
                '7-Eleven': allStoresInRoute.filter(s => s.brand === '7-Eleven').length,
                'Lawson': allStoresInRoute.filter(s => s.brand === 'Lawson').length,
                'FamilyMart': allStoresInRoute.filter(s => s.brand === 'FamilyMart').length
            };

            // Step 1: Ask for brand preference
            let brandSelectionHtml = `
                <div style="text-align: left;">
                    <p style="margin-bottom: 12px; font-size: 13px;">揀你想去嘅便利店品牌：</p>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="display: flex; align-items: center; padding: 8px; background: #f5f5f5; border-radius: 6px; cursor: pointer; font-size: 13px;">
                            <input type="checkbox" id="route_nav_7eleven" checked style="width: 18px; height: 18px; margin-right: 8px;">
                            <span>🟢 7-Eleven (${brandCounts['7-Eleven']})</span>
                        </label>
                        <label style="display: flex; align-items: center; padding: 8px; background: #f5f5f5; border-radius: 6px; cursor: pointer; font-size: 13px;">
                            <input type="checkbox" id="route_nav_lawson" checked style="width: 18px; height: 18px; margin-right: 8px;">
                            <span>🔵 Lawson (${brandCounts['Lawson']})</span>
                        </label>
                        <label style="display: flex; align-items: center; padding: 8px; background: #f5f5f5; border-radius: 6px; cursor: pointer; font-size: 13px;">
                            <input type="checkbox" id="route_nav_familymart" checked style="width: 18px; height: 18px; margin-right: 8px;">
                            <span>🟡 FamilyMart (${brandCounts['FamilyMart']})</span>
                        </label>
                    </div>
                </div>
            `;

            showCustomConfirm(
                '揀品牌',
                brandSelectionHtml,
                function() {
                    // Get selected brands
                    const include7Eleven = document.getElementById('route_nav_7eleven').checked;
                    const includeLawson = document.getElementById('route_nav_lawson').checked;
                    const includeFamilyMart = document.getElementById('route_nav_familymart').checked;

                    if (!include7Eleven && !includeLawson && !includeFamilyMart) {
                        showCustomAlert('錯誤', '請至少揀一個品牌。');
                        return;
                    }

                    // Preferred-brand stores come first.
                    const preferred = allStoresInRoute.filter(store => {
                        if (store.brand === '7-Eleven' && !include7Eleven) return false;
                        if (store.brand === 'Lawson' && !includeLawson) return false;
                        if (store.brand === 'FamilyMart' && !includeFamilyMart) return false;
                        return true;
                    });

                    if (preferred.length === 0) {
                        showCustomAlert('冇結果', '搵唔到你揀嘅品牌嘅店舖。');
                        return;
                    }

                    // If fewer than TARGET preferred stores are on the route, top up with
                    // the nearest-to-route stores of OTHER brands so the trip still has
                    // enough convenient stops. Preferred brands always keep priority.
                    const TARGET = 10;
                    let storesInRoute = [...preferred];
                    console.log('🔹 偏好品牌店數:', preferred.length, '| buffer內全部店:', allStoresInRoute.length);
                    if (storesInRoute.length < TARGET) {
                        const chosen = new Set(preferred.map(s => s.id));
                        // distance from each store to the nearest route sample point
                        const others = allStoresInRoute
                            .filter(s => !chosen.has(s.id))
                            .map(s => ({ s, d: distToRoute(s.latitude, s.longitude) }))
                            .sort((a, b) => a.d - b.d);
                        console.log('🔹 可補足的其他品牌店數:', others.length);
                        for (const o of others) {
                            if (storesInRoute.length >= TARGET) break;
                            storesInRoute.push(o.s);
                        }
                    } else if (storesInRoute.length > TARGET) {
                        // Too many preferred-brand stores — cap to the TARGET nearest
                        // to the route so exact mode's plan matches what's shown/routed.
                        storesInRoute.sort((a, b) => distToRoute(a.latitude, a.longitude) - distToRoute(b.latitude, b.longitude));
                        storesInRoute = storesInRoute.slice(0, TARGET);
                    }
                    console.log('🔹 補足後總店數:', storesInRoute.length,
                        '品牌分布:', storesInRoute.reduce((a,s)=>{a[s.brand]=(a[s.brand]||0)+1;return a;},{}));

                    // Render stores on map before selection
                    renderStoresForRouteSelection(storesInRoute, allStoresInRoute);

                    // Step 2: Enter map selection mode for route planning
                    directMapSelectionForRoute(storesInRoute, routePoints[0], routePoints[routePoints.length - 1], allStoresInRoute);
                },
                null
            );
        }
        window.openRouteInGoogleMaps = openRouteInGoogleMaps;
        window.openRouteInGoogleMaps = openRouteInGoogleMaps;

        // Scan area for stores using Google Places API
        async function scanAreaForStores(lat, lng, radius) {
            const service = new google.maps.places.PlacesService(document.createElement('div'));
            const newStores = [];

            const convenienceStoreTypes = [
                { keyword: '7-Eleven', brand: '7-Eleven' },
                { keyword: 'Lawson', brand: 'Lawson' },
                { keyword: 'FamilyMart', brand: 'FamilyMart' }
            ];

            for (const storeType of convenienceStoreTypes) {
                const request = {
                    location: new google.maps.LatLng(lat, lng),
                    radius: radius,
                    keyword: storeType.keyword,
                    type: 'convenience_store'
                };

                const results = await new Promise((resolve, reject) => {
                    service.nearbySearch(request, (results, status) => {
                        if (status === google.maps.places.PlacesServiceStatus.OK) {
                            resolve(results);
                        } else if (status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS) {
                            resolve([]);
                        } else {
                            reject(new Error(`Places API error: ${status}`));
                        }
                    });
                });

                for (const place of results) {
                    // Check if store already exists
                    const exists = allStores.some(s => s.id === place.place_id);
                    if (exists) continue;

                    const newStore = {
                        id: place.place_id,
                        name: place.name,
                        brand: storeType.brand,
                        latitude: place.geometry.location.lat(),
                        longitude: place.geometry.location.lng(),
                        address: place.vicinity || ''
                    };

                    allStores.push(newStore);
                    newStores.push(newStore);
                }
            }

            return newStores;
        }

        function findNearestStore() {
            if (!searchCircle || !searchMarker) {
                showCustomAlert('錯誤', '請先設定搜尋範圍。\n㩒地圖揀搜尋區域。');

            const centerLatLng = searchMarker.getLatLng();

            let minDistance = Infinity;

            const allStores = [...stores, ...gyms];

            allStores.forEach(store => {
                const storeLatLng = L.latLng(store.latitude, store.longitude);
                const distance = centerLatLng.distanceTo(storeLatLng);

                if (distance <= currentRadiusMeters && distance < minDistance) {
                    // Check if store matches current filters
                    if (store.type === 'gym') {
                        if (!filters.showGyms) return;
                        if (store.gymType === 'pokemon_center' && !filters.showPokemonCenter) return;
                        if (store.gymType === 'card_shop' && !filters.showCardShop) return;
                    } else {
                        if (!filters.showStores) return;
                        if (store.brand === '7-Eleven' && !filters.show7Eleven) return;
                        if (store.brand === 'Lawson' && !filters.showLawson) return;
                        if (store.brand === 'FamilyMart' && !filters.showFamilyMart) return;
                    }

                    minDistance = distance;
                    nearestStore = store;
                }
            });

            if (!nearestStore) {
                showCustomAlert('冇結果', '搜尋範圍內搵唔到店舖。\n擴大半徑再試。');
                return;
            }

            // Remove old route line if exists
            if (routePolyline) {
                map.removeLayer(routePolyline);
            }

            // Draw route line
            const storeLatLng = L.latLng(nearestStore.latitude, nearestStore.longitude);
            routePolyline = L.polyline([centerLatLng, storeLatLng], {
                color: '#4CAF50',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(map);

            // Add marker to nearest store
            const distanceKm = (minDistance / 1000).toFixed(2);
            const storeName = nearestStore.name || nearestStore.brand;

            const markerIcon = nearestStore.type === 'gym'
                ? (nearestStore.gymType === 'pokemon_center' ? '⭐' : '🏪')
                : (nearestStore.brand === '7-Eleven' ? '🟢' : (nearestStore.brand === 'Lawson' ? '🔵' : '🟡'));

            const marker = L.marker(storeLatLng, {
                icon: L.divIcon({
                    className: 'marker-icon',
                    html: `<div style="font-size: 24px; animation: bounce 1s infinite;">${markerIcon}</div>`,
                    iconSize: [40, 40]
                }),
                zIndexOffset: 1000
            }).addTo(map).bindPopup(`
                <strong>${storeName}</strong><br>
                距離: ${distanceKm} km<br>
                步行約 ${Math.ceil(minDistance / 80)} 分鐘
            `).openPopup();

            // Pan to show both points
            const bounds = L.latLngBounds([centerLatLng, storeLatLng]);
            map.fitBounds(bounds, { padding: [50, 50] });

            // Show success message
            showCustomAlert('最近店舖', `${storeName}\n距離: ${distanceKm} km\n步行約 ${Math.ceil(minDistance / 80)} 分鐘`);

            // Store the marker for cleanup
            window.nearestStoreMarker = marker;
        }

        // Calculate optimal route through all stores in the route buffer
        function calculateOptimalStoreRoute() {
            if (routePoints.length < 2) return;

            const filters = getFilters();
            const storesInRoute = [];

            // Fast shared buffer tester (precomputed once).
            const isInRouteBuffer = makeRouteBufferTester(routePoints, currentRadiusMeters);

            // Collect all stores within the route buffer
            if (filters.showStores) {
                allStores.forEach(store => {
                    if (store.brand === '7-Eleven' && !filters.show7Eleven) return;
                    if (store.brand === 'Lawson' && !filters.showLawson) return;
                    if (store.brand === 'FamilyMart' && !filters.showFamilyMart) return;

                    if (isInRouteBuffer(store.latitude, store.longitude)) {
                        storesInRoute.push({
                            ...store,
                            latlng: L.latLng(store.latitude, store.longitude)
                        });
                    }
                });
            }

            if (storesInRoute.length === 0) return;

            // Find optimal order using TSP nearest neighbor
            const startPoint = routePoints[0];
            const endPoint = routePoints[routePoints.length - 1];

            // Sort stores by nearest neighbor from start
            const orderedStores = [];
            const visited = new Set();
            let currentPos = startPoint;

            while (orderedStores.length < storesInRoute.length) {
                let nearestIdx = -1;
                let minDist = Infinity;

                for (let i = 0; i < storesInRoute.length; i++) {
                    if (visited.has(i)) continue;

                    const dist = currentPos.distanceTo(storesInRoute[i].latlng);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestIdx = i;
                    }
                }

                if (nearestIdx !== -1) {
                    visited.add(nearestIdx);
                    orderedStores.push(storesInRoute[nearestIdx]);
                    currentPos = storesInRoute[nearestIdx].latlng;
                }
            }

            // Draw optimized route through stores (DISABLED - not needed)
            // if (window.optimalRouteLine) {
            //     map.removeLayer(window.optimalRouteLine);
            // }
            // const routeCoords = [startPoint, ...orderedStores.map(s => s.latlng), endPoint];
            // window.optimalRouteLine = L.polyline(routeCoords, {
            //     color: '#4CAF50',
            //     weight: 3,
            //     opacity: 0.9,
            //     dashArray: '10, 5'
            // }).addTo(map);

            // Calculate total distance (for reference, not displayed)
            const routeCoords = [startPoint, ...orderedStores.map(s => s.latlng), endPoint];
            let totalDist = 0;
            for (let i = 0; i < routeCoords.length - 1; i++) {
                totalDist += routeCoords[i].distanceTo(routeCoords[i + 1]);
            }

            // Update info panel with optimized route info (DISABLED - not needed)
            // const infoPanel = document.getElementById('radiusInfo');
            // if (infoPanel) {
            //     const extraInfo = document.createElement('div');
            //     extraInfo.id = 'optimalRouteInfo';
            //     extraInfo.style.cssText = 'margin-top: 10px; padding: 8px; background: #e8f5e9; border-radius: 4px; font-size: 12px;';
            //     extraInfo.innerHTML = `
            //         <strong>🚶 最適ルート</strong><br>
            //         訪問店舗数: ${orderedStores.length} 件<br>
            //         総距離: ${(totalDist/1000).toFixed(1)} km<br>
            //         <span style="color: #4CAF50;">✓ 最短順序で表示中</span>
            //     `;
            //     const oldInfo = document.getElementById('optimalRouteInfo');
            //     if (oldInfo) oldInfo.remove();
            //     const detailsDiv = document.getElementById('radiusDetails');
            //     if (detailsDiv) {
            //         detailsDiv.insertAdjacentElement('afterend', extraInfo);

        // Optimize route using Nearest Neighbor algorithm
        function optimizeRoute() {
            if (routePoints.length < 3) {
                showCustomAlert('錯誤', '最佳化需要 3 個或以上地點。');
                return;
            }

            // Calculate current route distance
            const currentDistance = calculateTotalDistance(routePoints);

            // Use Nearest Neighbor algorithm
            const optimized = nearestNeighborTSP(routePoints);
            const optimizedDistance = calculateTotalDistance(optimized);

            // Update route points
            routePoints = optimized;

            // Redraw route
            if (routeLine) {
                map.removeLayer(routeLine);
            }

            routeLine = L.polyline(routePoints, {
                color: '#4CAF50',  // Green for optimized route
                weight: 4,
                opacity: 0.8
            }).addTo(map);

            // Update markers
            routeMarkers.forEach(marker => map.removeLayer(marker));
            routeMarkers = [];

            routePoints.forEach((point, idx) => {
                let iconHtml;
                if (idx === 0) {
                    iconHtml = '🚩'; // Start
                } else if (idx === routePoints.length - 1) {
                    iconHtml = '🏁'; // End
                } else {
                    iconHtml = `${idx + 1}`; // Numbered waypoints
                }

                const marker = L.marker(point, {
                    icon: L.divIcon({
                        className: 'marker-icon',
                        html: iconHtml,
                        iconSize: [40, 40]
                    })
                }).addTo(map).bindPopup(`地點 ${idx + 1}`);

                routeMarkers.push(marker);
            });

            // Recalculate stores
            renderMarkersInRoute();
            countStoresAlongRoute();

            // Show improvement
            const improvement = ((currentDistance - optimizedDistance) / currentDistance * 100).toFixed(1);
            const savedKm = ((currentDistance - optimizedDistance) / 1000).toFixed(1);

            showCustomAlert(
                '路線最佳化完成',
                `原本距離: ${(currentDistance/1000).toFixed(1)} km\n` +
                `最佳化後: ${(optimizedDistance/1000).toFixed(1)} km\n` +
                `縮短: ${savedKm} km（改善 ${improvement}%）`
            );
        }

        // Calculate total distance for a route
        function calculateTotalDistance(points) {
            let total = 0;
            for (let i = 0; i < points.length - 1; i++) {
                total += points[i].distanceTo(points[i + 1]);
            }
            return total;
        }

        // Nearest Neighbor TSP algorithm
        function nearestNeighborTSP(points) {
            if (points.length <= 2) return points;

            const visited = new Set();
            const result = [];

            // Start with first point
            let current = 0;
            result.push(points[current]);
            visited.add(current);

            // Visit nearest unvisited point
            while (visited.size < points.length) {
                let nearestIdx = -1;
                let minDist = Infinity;

                for (let i = 0; i < points.length; i++) {
                    if (visited.has(i)) continue;

                    const dist = points[current].distanceTo(points[i]);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestIdx = i;
                    }
                }

                if (nearestIdx !== -1) {
                    visited.add(nearestIdx);
                    result.push(points[nearestIdx]);
                    current = nearestIdx;
                }
            }

            return result;
        }

        window.optimizeRoute = optimizeRoute;

        function renderMarkersInRoute() {
            // Clear existing markers
            storeMarkers.forEach(marker => map.removeLayer(marker));
            storeMarkers = [];
            gymMarkers.forEach(marker => map.removeLayer(marker));
            gymMarkers = [];
            areaMarkers.forEach(marker => map.removeLayer(marker));
            areaMarkers = [];

            if (routePoints.length < 2) return;

            const filters = getFilters();
            const bufferRadius = currentRadiusMeters;
            const clusterRadius = currentRadiusMeters; // Use same radius as search range, not fixed 2km

            // Collect all stores within route buffer
            const storesInRoute = [];

            const isInRouteBuffer = makeRouteBufferTester(routePoints, bufferRadius);

            // Collect stores in route
            if (filters.showStores) {
                allStores.forEach(store => {
                    if (store.brand === '7-Eleven' && !filters.show7Eleven) return;
                    if (store.brand === 'Lawson' && !filters.showLawson) return;
                    if (store.brand === 'FamilyMart' && !filters.showFamilyMart) return;

                    if (isInRouteBuffer(store.latitude, store.longitude)) {
                        storesInRoute.push(store);
                    }
                });
            }

            // Cluster stores using same radius as search range
            const clusters = [];
            const used = new Set();

            storesInRoute.forEach((store, idx) => {
                if (used.has(idx)) return;

                const cluster = {
                    center: { lat: store.latitude, lng: store.longitude },
                    stores: [store]
                };
                used.add(idx);

                // Find all stores within cluster radius (same as search range)
                storesInRoute.forEach((otherStore, otherIdx) => {
                    if (used.has(otherIdx)) return;

                    const dist = L.latLng(store.latitude, store.longitude).distanceTo(
                        L.latLng(otherStore.latitude, otherStore.longitude)
                    );

                    if (dist <= clusterRadius) {
                        cluster.stores.push(otherStore);
                        used.add(otherIdx);
                    }
                });

                // Calculate cluster center (average position)
                let sumLat = 0, sumLng = 0;
                cluster.stores.forEach(s => {
                    sumLat += s.latitude;
                    sumLng += s.longitude;
                });
                cluster.center = {
                    lat: sumLat / cluster.stores.length,
                    lng: sumLng / cluster.stores.length
                };

                clusters.push(cluster);
            });

            // Find the cluster with most stores
            let maxClusterIdx = 0;
            let maxCount = clusters.length > 0 ? clusters[0].stores.length : 0;
            clusters.forEach((cluster, idx) => {
                if (cluster.stores.length > maxCount) {
                    maxCount = cluster.stores.length;
                    maxClusterIdx = idx;
                }
            });

            // Render cluster markers
            clusters.forEach((cluster, idx) => {
                const count = cluster.stores.length;
                const isHighest = idx === maxClusterIdx && clusters.length > 1;

                // Count by brand
                const brandCounts = { '7-Eleven': 0, 'Lawson': 0, 'FamilyMart': 0 };
                cluster.stores.forEach(store => {
                    if (brandCounts[store.brand] !== undefined) {
                        brandCounts[store.brand]++;
                    }
                });

                // Create popup content with "Show Stores" button
                let popupHtml = `<div style="min-width: 200px;">`;
                popupHtml += `<div style="font-weight: bold; font-size: 16px; margin-bottom: 8px;">`;
                popupHtml += isHighest ? `⭐ 區域 ${idx + 1}（最多!）` : `區域 ${idx + 1}`;
                popupHtml += `</div>`;
                popupHtml += `<div style="font-size: 14px; margin-bottom: 8px;">合共: <strong>${count}</strong> 間</div>`;
                popupHtml += `<div style="font-size: 12px; color: #666;">`;
                if (brandCounts['7-Eleven'] > 0) popupHtml += `🟢 7-Eleven: ${brandCounts['7-Eleven']}<br>`;
                if (brandCounts['Lawson'] > 0) popupHtml += `🔵 Lawson: ${brandCounts['Lawson']}<br>`;
                if (brandCounts['FamilyMart'] > 0) popupHtml += `🟡 FamilyMart: ${brandCounts['FamilyMart']}<br>`;
                popupHtml += `</div>`;
                popupHtml += `<div style="font-size: 11px; color: #999; margin-top: 8px;">半徑 ${(clusterRadius / 1000).toFixed(1)} km 以內</div>`;
                popupHtml += `<button onclick="showAreaStores(${idx})" style="margin-top: 10px; padding: 8px 16px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;">顯示店舖</button>`;
                popupHtml += `</div>`;

                // Create marker icon
                const iconHtml = isHighest ? `<div style="background: #FF5722; color: white; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer;">${count}</div>` :
                    `<div style="background: #2196F3; color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer;">${count}</div>`;

                const marker = L.marker([cluster.center.lat, cluster.center.lng], {
                    icon: L.divIcon({
                        className: 'cluster-marker',
                        html: iconHtml,
                        iconSize: isHighest ? [50, 50] : [40, 40]
                    })
                }).addTo(map).bindPopup(popupHtml);

                areaMarkers.push(marker);

                // Draw circle around cluster area
                const circle = L.circle([cluster.center.lat, cluster.center.lng], {
                    radius: clusterRadius,
                    color: isHighest ? '#FF5722' : '#2196F3',
                    fillColor: isHighest ? '#FF5722' : '#2196F3',
                    fillOpacity: 0.1,
                    weight: 2,
                    dashArray: '5, 5'
                }).addTo(map);

                areaMarkers.push(circle);
            });

            // Store cluster info globally for showAreaStores function
            window.routeClusters = clusters;
            window.maxClusterIdx = maxClusterIdx;
        }

        // Show stores in a specific area
        function showAreaStores(clusterIdx) {
            const cluster = window.routeClusters[clusterIdx];

            areaMarkers.forEach(marker => map.removeLayer(marker));

            areaDetailMode = true;

            cluster.stores.forEach(store => {

        function updateRadiusInfoForAllStores(stores) {

        // Calculate optimal route using nearest neighbor algorithm
        function calculateOptimalRoute(clusterIdx) {
            const cluster = window.routeClusters[clusterIdx];
            if (!cluster || cluster.stores.length === 0) return;

            // Use nearest neighbor algorithm (greedy approach)
            const stores = [...cluster.stores];
            const route = [];

            // Start from cluster center (or first store)
            let currentPos = cluster.center;
            const remaining = [...stores];

            // Build route by always going to nearest unvisited store
            while (remaining.length > 0) {
                let nearestIdx = 0;
                let nearestDist = L.latLng(currentPos.lat, currentPos.lng).distanceTo(
                    L.latLng(remaining[0].latitude, remaining[0].longitude)
                );

                for (let i = 1; i < remaining.length; i++) {
                    const dist = L.latLng(currentPos.lat, currentPos.lng).distanceTo(
                        L.latLng(remaining[i].latitude, remaining[i].longitude)
                    );
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestIdx = i;
                    }
                }

                const nextStore = remaining[nearestIdx];
                route.push(nextStore);
                currentPos = { lat: nextStore.latitude, lng: nextStore.longitude };
                remaining.splice(nearestIdx, 1);
            }

            // Calculate total distance
            let totalDistance = 0;
            for (let i = 0; i < route.length - 1; i++) {
                totalDistance += L.latLng(route[i].latitude, route[i].longitude).distanceTo(
                    L.latLng(route[i + 1].latitude, route[i + 1].longitude)
                );
            }

            // Google Maps has a limit of ~10 waypoints for directions
            // If more than 10 stores, we'll create multiple routes or use a different approach
            if (route.length <= 10) {
                openGoogleMapsRoute(route, totalDistance);
            } else {
                // For more than 10 stores, open with first 10 and show a message
                const limitedRoute = route.slice(0, 10);
                openGoogleMapsRoute(limitedRoute, totalDistance, route.length);
            }
        }

        // Open Google Maps with the optimized route
        function openGoogleMapsRoute(route, totalDistance, originalLength) {
            if (route.length === 0) return;

            // Build Google Maps Directions URL
            // Format: origin=lat,lng&destination=lat,lng&waypoints=lat1,lng1|lat2,lng2|...
            const origin = `${route[0].latitude},${route[0].longitude}`;
            const destination = `${route[route.length - 1].latitude},${route[route.length - 1].longitude}`;

            let waypoints = '';
            if (route.length > 2) {
                const waypointCoords = route.slice(1, -1).map(store =>
                    `${store.latitude},${store.longitude}`
                );
                waypoints = `&waypoints=${waypointCoords.join('|')}`;
            }

            const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints}&travelmode=driving`;

            // Show confirmation with route details
            const storeList = route.slice(0, 5).map((store, idx) =>
                `${idx + 1}. ${store.brand} - ${store.name}`
            ).join('\n');

            let message = `已經整好最佳化路線！\n\n到訪順序（頭 5 間店舖）:\n${storeList}${route.length > 5 ? `\n... 仲有 ${route.length - 5} 間` : ''}\n\n用 Google Maps 開啟？`;

            showCustomConfirm('開啟路線', message,
                () => {
                    console.log('Opening Google Maps:', googleMapsUrl);
                    const opened = window.open(googleMapsUrl, '_blank');

                    // Show warning message after opening (if route was limited)
                    if (originalLength && originalLength > 10) {
                        setTimeout(() => {
                            showCustomAlert('注意', `Google Maps 最多支援 10 個途經點。\n只顯示咗頭 10 間店舖嘅路線。\n\n店舖總數: ${originalLength}\n顯示: 頭 10 間\n估計總距離: ${(totalDistance / 1000).toFixed(1)} km`);
                        }, 500);
                    }

                    if (!opened || opened.closed || typeof opened.closed === 'undefined') {
                        // Popup blocked, show link instead
                        showGoogleMapsLink(googleMapsUrl);
                    }
                },
                null
            );
        }

        // Show Google Maps link if popup is blocked
        function showGoogleMapsLink(url) {
            const linkHtml = `<a href="${url}" target="_blank" style="color: #2196F3; text-decoration: underline;">㩒呢度用 Google Maps 開啟</a>`;
            showCustomAlert('彈出視窗被封鎖',

        }

        // Go back to area view
        function backToAreaView() {
            areaDetailMode = false;
            currentAreaStores = [];

            // Clear existing markers
            storeMarkers.forEach(marker => map.removeLayer(marker));
            storeMarkers = [];
            gymMarkers.forEach(marker => map.removeLayer(marker));
            gymMarkers = [];

            renderMarkersInRoute();
            countStoresAlongRoute();
        }
        window.backToAreaView = backToAreaView;

        function countStoresAlongRoute() {
            if (routePoints.length < 2) return;

            const filters = getFilters();
            let storesCount = 0;
            let brandCounts = { '7-Eleven': 0, 'Lawson': 0, 'FamilyMart': 0 };

            const bufferRadius = currentRadiusMeters;

            // Helper function to check if point is within route buffer
            const isInRouteBuffer = makeRouteBufferTester(routePoints, bufferRadius);

            // Check each store
            if (filters.showStores) {
                allStores.forEach(store => {
                    if (store.brand === '7-Eleven' && !filters.show7Eleven) return;
                    if (store.brand === 'Lawson' && !filters.showLawson) return;
                    if (store.brand === 'FamilyMart' && !filters.showFamilyMart) return;

                    if (isInRouteBuffer(store.latitude, store.longitude)) {
                        storesCount++;
                        if (brandCounts[store.brand] !== undefined) {
                            brandCounts[store.brand]++;
                        }
                    }
                });
            }

            // Calculate total route distance
            let totalDistance = 0;
            for (let i = 0; i < routePoints.length - 1; i++) {
                totalDistance += routePoints[i].distanceTo(routePoints[i + 1]);
            }
            const routeDistance = (totalDistance / 1000).toFixed(1);

            // Get cluster info if available
            const clusters = window.routeClusters || [];
            const maxClusterIdx = window.maxClusterIdx || 0;

            // Display results
            document.getElementById('radiusCount').textContent = `${storesCount} 間`;

            let detailsHtml = '';

            // Left column
            detailsHtml += `<div>`;
            detailsHtml += `<strong>路線距離: ${routeDistance} km</strong><br>`;
            detailsHtml += `地點數: ${routePoints.length}<br>`;
            detailsHtml += `範圍: 單邊 ${(bufferRadius / 1000).toFixed(1)} km`;

            // Show cluster info
            if (clusters.length > 0) {
                detailsHtml += `<br><br><strong style="color: #2196F3;">📍 區域數: ${clusters.length}</strong><br>`;
                detailsHtml += `<small style="color: #666;">地圖上嘅數字 = ${(bufferRadius / 1000).toFixed(1)}km 範圍內嘅店舖數</small>`;
            }
            detailsHtml += `</div>`;

            // Right column
            detailsHtml += `<div>`;

            // Most dense area
            if (clusters.length > 0) {
                const maxCluster = clusters[maxClusterIdx];
                detailsHtml += `<strong style="color: #FF5722;">⭐ 最密集區域 ${maxClusterIdx + 1}:</strong><br>`;
                detailsHtml += `店舖數: ${maxCluster.stores.length} 間<br>`;
                detailsHtml += `<small style="color: #666;">㩒紅色數字睇詳情</small>`;
            }

            detailsHtml += `<br><br><strong>整條路線合計:</strong><br>`;
            detailsHtml += `便利店: ${storesCount} 間`;

            if (storesCount > 0) {
                detailsHtml += `<br>`;
                const brands = [
                    { name: '7-Eleven', emoji: '🟢', count: brandCounts['7-Eleven'], show: filters.show7Eleven },
                    { name: 'Lawson', emoji: '🔵', count: brandCounts['Lawson'], show: filters.showLawson },
                    { name: 'FamilyMart', emoji: '🟡', count: brandCounts['FamilyMart'], show: filters.showFamilyMart }
                ];

                brands.forEach(brand => {
                    if (brand.show && brand.count > 0) {
                        detailsHtml += `${brand.emoji} ${brand.name}: ${brand.count} `;
                    }
                });
            }
            detailsHtml += `</div>`;

            // Full-width button row
            if (storesCount > 0) {
                detailsHtml += `
                <div style="display: flex; gap: 8px; grid-column: 1 / -1; margin-top: 8px;">
                    <button onclick="showAllRouteStores()" style="padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; width: 100%;">📍 喺地圖顯示全部店舖</button>
                </div>`;
            }

            document.getElementById('radiusDetails').innerHTML = detailsHtml;

            // Add Google Maps button for route planning mode
            if (storesCount > 0) {
                document.getElementById('radiusButtons').innerHTML = `
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <button onclick="openRouteInGoogleMaps()" style="padding: 8px 12px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; flex: 1;">🗺️ Google Maps</button>
                        <button onclick="clearRoute()" style="padding: 8px 12px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; flex: 1;">✕ 清除</button>
                    </div>
                `;
            } else {
                document.getElementById('radiusButtons').innerHTML = '';
            }

            document.getElementById('radiusInfo').classList.add('show');
        }

        // ==================== Start Application ====================
        init();
    </script>
